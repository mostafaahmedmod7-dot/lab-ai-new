<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOZMEN LAB SYSTEM | PRO</title>
    <style>
        /* CSS المتطور والمستجيب */
        :root { --primary: #2563eb; --dark: #111827; --green: #059669; --bg: #f3f6fb; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg); color: var(--dark); line-height: 1.6; }
        .layout { display: flex; min-height: 100vh; }

        /* SIDEBAR */
        .sidebar { width: 280px; background: var(--dark); color: #fff; padding: 25px; display: flex; flex-direction: column; gap: 15px; transition: 0.3s; }
        .logo-box { margin-bottom: 30px; text-align: center; }
        .logo-main { font-size: 26px; font-weight: 900; color: #fff; text-shadow: 0 0 15px rgba(37,99,235,0.6); }
        .logo-sub { font-size: 11px; color: #60a5fa; letter-spacing: 1px; margin-top: 5px; }
        
        .tab-btn { 
            border: none; background: #1f2937; color: #fff; padding: 16px; border-radius: 12px; 
            text-align: right; cursor: pointer; font-size: 15px; font-weight: 600; transition: 0.3s; 
        }
        .tab-btn:hover, .tab-btn.active { background: var(--primary); transform: translateX(-5px); }

        /* CONTENT AREA */
        .content { flex: 1; padding: 30px; max-width: 1200px; margin: 0 auto; }
        .tab-content { display: none; animation: fadeIn 0.4s; }
        .tab-content.active { display: block; }

        .card { background: #fff; border-radius: 24px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); margin-bottom: 25px; border: 1px solid #eef2f6; }
        h1 { font-size: 22px; margin-bottom: 15px; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 1.5px solid #d1d5db; outline: none; font-size: 16px; transition: 0.3s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(37,99,235,0.1); }

        /* LISTS & ITEMS */
        .results-box { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto; }
        .test-item { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .test-item:hover { border-color: var(--primary); background: #eff6ff; }
        
        .selected-list { margin-top: 15px; }
        .sel-item { background: #eff6ff; border: 1px solid #dbeafe; padding: 12px 18px; border-radius: 15px; display: flex; justify-content: space-between; margin-bottom: 10px; }
        
        /* FOOTER CONTROLS */
        .totals-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .stat-box { background: #f9fafb; padding: 15px; border-radius: 15px; border: 1px solid #e5e7eb; }
        .stat-box small { color: #6b7280; font-size: 12px; display: block; }
        .stat-box strong { font-size: 18px; color: var(--dark); }

        .btn { border: none; padding: 15px 25px; border-radius: 12px; cursor: pointer; font-weight: 700; transition: 0.3s; flex: 1; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-green { background: var(--green); color: #fff; }
        .btn-dark { background: var(--dark); color: #fff; }
        .btn:active { transform: scale(0.95); }

        /* COMPARE RESULTS */
        .pkg-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 20px; padding: 20px; margin-bottom: 15px; transition: 0.3s; }
        .pkg-card:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(0,0,0,0.08); }
        .match-badge { background: #dcfce7; color: #166534; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 900; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 768px) { .layout { flex-direction: column; } .sidebar { width: 100%; flex-direction: row; overflow-x: auto; } }
    </style>
</head>
<body>

<div class="layout">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo-box">
            <div class="logo-main">MOZMEN LAB</div>
            <div class="logo-sub">DEVELOPMENT BY MOSTAFA</div>
        </div>
        <button class="tab-btn active" data-target="pricing">💰 تسعير التحاليل</button>
        <button class="tab-btn" data-target="compare">🔍 مقارنة الباقات</button>
    </div>

    <!-- Main Content -->
    <div class="content">
        
        <!-- SECTION 1: PRICING -->
        <div id="pricing" class="tab-content active">
            <div class="card">
                <h1>💰 نظام التسعير السريع</h1>
                <input type="text" id="pricingSearch" placeholder="ابحث باسم التحليل (مثال: CBC)..." />
                <div id="pricingResults" class="results-box"></div>
            </div>

            <div class="card">
                <h2>📋 قائمة الفحص</h2>
                <div id="chosenList" class="selected-list"></div>
                <div style="margin-top: 15px;">
                    <label>نسبة الخصم (%)</label>
                    <input type="number" id="discountInput" value="0" min="0" max="100">
                </div>
                <div class="totals-grid">
                    <div class="stat-box"><small>قبل الخصم</small><strong id="totalBefore">0 EGP</strong></div>
                    <div class="stat-box"><small>قيمة الخصم</small><strong id="discAmount">0 EGP</strong></div>
                    <div class="stat-box"><small>الإجمالي النهائي</small><strong id="totalAfter" style="color:var(--green)">0 EGP</strong></div>
                </div>
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button class="btn btn-green" id="copyBtn">نسخ الفاتورة</button>
                    <button class="btn btn-dark" id="clearPricing">مسح الكل</button>
                </div>
            </div>
        </div>

        <!-- SECTION 2: COMPARE -->
        <div id="compare" class="tab-content">
            <div class="card">
                <h1>🔍 أين توجد هذه التحاليل؟</h1>
                <p style="font-size:13px; color:#6b7280;">أضف تحاليل المستخدم هنا لنقترح له أفضل الباقات الموفرة.</p>
                <input type="text" id="compareSearch" placeholder="ابحث عن تحاليل لإضافتها للمقارنة..." />
                <div id="compareSearchRes" class="results-box"></div>
            </div>

            <div class="card">
                <h2>🛠️ التحاليل المطلوب فحصها</h2>
                <div id="compareChosenList" class="selected-list"></div>
                <div style="display:flex; gap:10px; margin-top:15px;">
                    <button class="btn btn-primary" onclick="runComparison()">بدء تحليل الباقات</button>
                    <button class="btn btn-dark" id="clearCompare">مسح الكل</button>
                </div>
            </div>

            <div id="finalComparisonResults"></div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // Config
    const S_URL = "https://ezawuhkjdghyfekoezbq.supabase.co";
    const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6YXd1aGtqZGdoeWZla29lemJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0OTEwNTYsImV4cCI6MjA5MzA2NzA1Nn0.l6yUV_FsPsvAurhKbjkxC_LkjxF6nW8lMw0i_g3A-Eo";
    const supabaseClient = supabase.createClient(S_URL, S_KEY);

    // Data Store
    let DB = { tests: [], packages: [], relations: [] };
    let pricingSelection = [];
    let compareSelection = [];

    // Initialize Data (Fetch everything at once for speed)
    async function init() {
        const [t, p, r] = await Promise.all([
            supabaseClient.from('tests').select('*'),
            supabaseClient.from('packages').select('*'),
            supabaseClient.from('package_tests').select('*')
        ]);
        DB.tests = t.data || [];
        DB.packages = p.data || [];
        DB.relations = r.data || [];
        console.log("Database Sync Ready");
    }
    init();

    // Utility
    const fmt = (num) => Number(num).toLocaleString('en-EG') + " EGP";

    // Tab Switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn, .tab-content').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(btn.dataset.target).classList.add('active');
        });
    });

    // PRICING SEARCH
    document.getElementById('pricingSearch').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const results = DB.tests.filter(x => x.name.toLowerCase().includes(term)).slice(0, 15);
        const container = document.getElementById('pricingResults');
        container.innerHTML = term ? results.map(item => `
            <div class="test-item" onclick="addToPricing(${item.id})">
                <span>${item.name}</span>
                <span class="match-badge" style="background:#e0f2fe; color:#0369a1">${fmt(item.price)}</span>
            </div>
        `).join('') : '';
    });

    function addToPricing(id) {
        if(pricingSelection.find(x => x.id === id)) return;
        pricingSelection.push(DB.tests.find(x => x.id === id));
        updatePricingUI();
    }

    function updatePricingUI() {
        const list = document.getElementById('chosenList');
        list.innerHTML = pricingSelection.map(x => `
            <div class="sel-item">
                <strong>${x.name}</strong>
                <div>
                    <span style="margin-left:15px;">${fmt(x.price)}</span>
                    <button onclick="removeFromPricing(${x.id})" style="border:none; color:red; cursor:pointer; background:none;">حذف</button>
                </div>
            </div>
        `).join('');
        
        // Calculations
        const before = pricingSelection.reduce((a,b) => a + b.price, 0);
        const discPerc = document.getElementById('discountInput').value;
        const discVal = before * (discPerc/100);
        const final = before - discVal;

        document.getElementById('totalBefore').innerText = fmt(before);
        document.getElementById('discAmount').innerText = fmt(discVal);
        document.getElementById('totalAfter').innerText = fmt(final);
    }

    window.removeFromPricing = (id) => {
        pricingSelection = pricingSelection.filter(x => x.id !== id);
        updatePricingUI();
    };

    document.getElementById('discountInput').addEventListener('input', updatePricingUI);

    // COMPARE SEARCH
    document.getElementById('compareSearch').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const results = DB.tests.filter(x => x.name.toLowerCase().includes(term)).slice(0, 10);
        const container = document.getElementById('compareSearchRes');
        container.innerHTML = term ? results.map(item => `
            <div class="test-item" onclick="addToCompare(${item.id})">
                <span>${item.name}</span>
                <span style="font-size:11px; color:#3b82f6;">+ إضافة للمقارنة</span>
            </div>
        `).join('') : '';
    });

    function addToCompare(id) {
        if(compareSelection.find(x => x.id === id)) return;
        compareSelection.push(DB.tests.find(x => x.id === id));
        document.getElementById('compareChosenList').innerHTML = compareSelection.map(x => `
            <div class="sel-item">
                <span>${x.name}</span>
                <button onclick="removeFromCompare(${x.id})" style="border:none; color:red; cursor:pointer; background:none;">حذف</button>
            </div>
        `).join('');
    }

    window.removeFromCompare = (id) => {
        compareSelection = compareSelection.filter(x => x.id !== id);
        addToCompare(); // Refresh list
    };

    // CORE COMPARISON ENGINE (Logic)
    window.runComparison = () => {
        if(compareSelection.length === 0) return alert("اختر تحاليل أولاً");
        
        const testIds = compareSelection.map(x => x.id);
        
        // Find how each package matches
        const analysis = DB.packages.map(pkg => {
            const pkgTests = DB.relations.filter(r => r.package_id === pkg.id).map(r => r.test_id);
            const common = pkgTests.filter(id => testIds.includes(id));
            const matchPerc = Math.round((common.length / testIds.length) * 100);
            return { ...pkg, matchCount: common.length, percentage: matchPerc, totalPkgTests: pkgTests.length };
        })
        .filter(p => p.matchCount > 0)
        .sort((a,b) => b.percentage - a.percentage || a.price - b.price);

        const resDiv = document.getElementById('finalComparisonResults');
        resDiv.innerHTML = '<h2>النتائج المقترحة</h2>' + (analysis.length ? analysis.map(p => `
            <div class="pkg-card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <h3 style="color:var(--primary)">${p.name}</h3>
                        <small>تحتوي على ${p.matchCount} من أصل ${compareSelection.length} تحاليل مطلوبة</small>
                    </div>
                    <span class="match-badge">${p.percentage}% مطابقة</span>
                </div>
                <div style="display:flex; justify-content:space-between; margin-top:15px; border-top:1px solid #eee; padding-top:10px;">
                    <span style="font-weight:900; color:var(--green); font-size:20px;">${fmt(p.price)}</span>
                    <span style="font-size:12px; color:#9ca3af;">إجمالي محتوى الباقة: ${p.totalPkgTests}</span>
                </div>
            </div>
        `).join('') : '<div class="card">لا توجد باقة تحتوي على هذه التحاليل.</div>');
    };

    // Copying Report
    document.getElementById('copyBtn').addEventListener('click', () => {
        if(!pricingSelection.length) return;
        let t = "📋 تقرير تسعير معامل MOZMEN\n\n";
        pricingSelection.forEach((x, i) => t += `${i+1}. ${x.name} : ${fmt(x.price)}\n`);
        t += `\n💰 الإجمالي: ${document.getElementById('totalBefore').innerText}`;
        t += `\n🎯 الخصم: ${document.getElementById('discountInput').value}%`;
        t += `\n✅ الصافي النهائي: ${document.getElementById('totalAfter').innerText}`;
        
        navigator.clipboard.writeText(t);
        alert("تم نسخ التقرير بنجاح");
    });

    // Clear Functions
    document.getElementById('clearPricing').addEventListener('click', () => { pricingSelection = []; updatePricingUI(); });
    document.getElementById('clearCompare').addEventListener('click', () => { 
        compareSelection = []; 
        document.getElementById('compareChosenList').innerHTML = ''; 
        document.getElementById('finalComparisonResults').innerHTML = '';
    });

</script>
</body>
</html>
